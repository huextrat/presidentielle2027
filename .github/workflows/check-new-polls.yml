name: Check for New Presidential Polls

on:
  schedule:
    # Run every day at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-polls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # check_new_polls.py is stdlib only and dedupes on notice filenames, so this
      # step is safe to re-run: a notice already tracked in polls.csv or already
      # covered by a new-poll issue (open or closed) is never reported twice.
      - name: Check for new polls and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_new_polls.py --create --repo "$GITHUB_REPOSITORY" | tee "$GITHUB_STEP_SUMMARY"
